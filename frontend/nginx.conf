server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;

    # API, Django admin and its static files -> backend container.
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;                 # keeps the port, so Django's CSRF origin check passes
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;        # nginx creates the request ID; Django logs it and sends it back

        # Chat answers are streamed: pass every piece to the browser immediately.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # React app: unknown paths (e.g. /chat, /findings/3) load index.html and React Router takes over.
    location / {
        try_files $uri /index.html;
    }
}

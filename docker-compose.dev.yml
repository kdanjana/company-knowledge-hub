# Local development (complete on its own; does not need docker-compose.yml).
#   docker compose -f docker-compose.dev.yml up -d --build   →  open http://localhost:5173
# Live code is mounted into the containers: no rebuild needed after code changes.
# Rebuild (--build) only after changing backend/requirements.txt or backend/Dockerfile.
#
# Values come from the .env file in this folder (copy .env.example to .env first).

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: kb_auditor_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kb_auditor}
      POSTGRES_USER: ${POSTGRES_USER:-kb_auditor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"  # also reachable from the laptop (DB tools)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    container_name: kb_auditor_redis
    # Used only as a cache (rate-limit counters): nothing saved to disk, max 64 MB.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile   # image gives Python + packages; the code comes from the mount below
    container_name: kb_auditor_backend
    # Django's dev server auto-reloads when you save a .py file (instead of gunicorn).
    command: ["sh", "-c", "python manage.py migrate --noinput && exec python manage.py runserver 0.0.0.0:8000"]
    env_file: .env
    volumes:
      - ./backend:/app/backend     # live backend code
      - ./data:/app/data           # live test data
      - uploads:/app/uploads       # uploaded documents; shared with the worker
    environment: &backend_env
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      KB_DATABASE_URL: ""          # built from the POSTGRES_* values above
      REDIS_URL: "redis://redis:6379/0"
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      CSRF_TRUSTED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready/')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: kb_auditor_worker
    # Does NOT reload by itself: after changing worker code run
    #   docker compose -f docker-compose.dev.yml restart worker
    command: ["worker"]
    env_file: .env
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
      - uploads:/app/uploads       # the worker reads uploaded files to chunk + embed them
    environment: *backend_env
    depends_on:
      backend:
        condition: service_healthy   # the backend runs the migrations first

  frontend:
    image: node:22-alpine          # Vite dev server (hot reload), not the nginx build
    container_name: kb_auditor_frontend
    working_dir: /app
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0"]
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app            # live frontend code
      - /app/node_modules          # Linux packages stay inside the container, not in your folder
    environment:
      API_PROXY_TARGET: "http://backend:8000"
      WATCH_POLLING: "true"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  uploads:

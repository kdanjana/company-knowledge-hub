# Answer key for the QuickBite test documents.
#
# Each item names two passages by document file + a short piece of text that appears in the passage.
#   kind: contradiction | duplicate  -> the auditor SHOULD report it
#   kind: trap                       -> looks like a conflict but is not; the auditor should NOT report it
#   expected_truth                   -> which document should win (null = cannot be decided from metadata)
#
# Rule for keeping this file honest: every REAL conflict or duplicate in the documents must be listed here,
# otherwise a correct finding would be counted as a false alarm. Traps are a sample, not a full list.

items:
  # ---------- Real contradictions ----------
  - id: C01
    kind: contradiction
    topic: Refund window (India)
    doc_a: refund-policy-2023.md
    text_a: "within 7 days of delivery"
    doc_b: refund-policy-2025.md
    text_b: "India can request a refund within 3 days"
    expected_truth: refund-policy-2025.md

